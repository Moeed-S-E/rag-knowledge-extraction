[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-extraction"
version = "1.0.0"
description = "Offline-first RAG knowledge extraction system with CLI and FastAPI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
]

[project.scripts]
rag-cli = "rag_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
