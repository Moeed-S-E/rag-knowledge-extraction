[project]
name = "ragkit"
version = "0.1.0"
description = "RAG-powered knowledge extraction system"
requires-python = ">=3.11"
dependencies = [
    # Core
    "numpy>=2.0",
    "pandas>=2.2",

    # NLP
    "spacy>=3.8.9,<=3.8.13",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "nltk>=3.8",

    # Embeddings
    "sentence-transformers>=3.0",
    "transformers>=4.41,<5.0",
    "torch>=2.2,<3.0",

    # Vector Database
    "chromadb>=0.5",

    # LLM / API
    "openai>=1.30",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "typer>=0.12",

    # Recommended
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    "tqdm>=4.66",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]
